name: rallly

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    env_file:
      - /volume1/@rallly-secrets/postgres.env
    volumes:
      - database:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rallly -d rallly"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    logging: *logging

  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    restart: unless-stopped
    env_file:
      - /volume1/@rallly-secrets/garage.env
    volumes:
      - /volume1/@rallly-secrets/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks: [private]
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 384m
    logging: *logging

  app:
    image: ${RALLLY_APP_IMAGE:?Set RALLLY_APP_IMAGE in release.env}
    build:
      context: ./current
      dockerfile: deploy/nas/Dockerfile
      args:
        APP_VERSION: ${RALLLY_APP_VERSION:?Set RALLLY_APP_VERSION in release.env}
    restart: unless-stopped
    env_file:
      - path: /volume1/@rallly-secrets/app.env
        format: raw
    networks: [private, mail]
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
    mem_limit: 1536m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  web:
    image: nginx:stable-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    restart: unless-stopped
    ports:
      - "192.168.178.10:18151:8080"
    volumes:
      - /volume1/docker/rallly/current/deploy/nas/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /volume1/docker/rallly/source:/srv/source:ro
    networks: [private, ingress]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]
    logging: *logging

volumes:
  database:
  garage_meta:
  garage_data:

networks:
  private:
    internal: true
  mail:
  ingress:
